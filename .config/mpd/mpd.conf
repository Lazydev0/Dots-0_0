db_file            "~/.config/mpd/database"

log_file           "syslog"

music_directory    "~/Music"  

auto_update "yes"  

playlist_directory "~/.config/mpd/playlists"  
pid_file           "~/.config/mpd/pid"        
state_file         "~/.local/state/mpd/state"  
sticker_file       "~/.config/mpd/sticker.sql" 

audio_output {
    type        "pipewire"
    name        "PipeWire Audio Output"
    device      "default"
    mixer_type  "software"
    samplerate  "44100"
    buffer_size "4096"
    rewind_time "200000"
}

audio_output {
    type        "fifo"
    name        "Visualizer FIFO"
    path        "/tmp/mpd.fifo"
    format      "44100:16:2"
}
