background {
    monitor =
    path=/home/nyx/.cache/wall_cache/lockscreen_images/lock.png
    blur_passes = 5
    contrast = 0.9
    vibrancy = 0.17
    vibrancy_darkness = 0
}

input-field {
    monitor =
    size = 200, 40
    outline_thickness = 0
    dots_size = 0.20
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    inner_color = rgba(255,215,215,160)
    font_color = rgb(11111b)
    fade_on_empty = true
    placeholder_text = 
    fade_timeout = 1000
    hide_input = false
    fail_text= 
    rounding = -1
    check_color = rgba(220,255,255,160)
    fail_color = rgba(245, 220, 245, 160)
    fail_transition = 100
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false
    position = 0, -300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/user/hour.sh
    color = rgb(fbe7ff)
    font_size = 170
    font_family = SuperDream
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/user/minutes.sh
    color = rgb(85aaff)
    font_size  = 170
    font_family = SuperDream
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%a, %b %d")"
    color = rgb(fbe7ff)
    font_family = FiraCodeNerd Bold
    position = 100, -100
    halign = left
    valign = top
}

# Greet
label {
    monitor =
    text = cmd[update:1000] ~/.config/scripts/user/greet.sh
    color = rgb(C3E88E)
    font_family = FiraCodeNerd Bold
    position = 100, -130
    halign = left
    valign = top
}

