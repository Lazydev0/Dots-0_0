format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "blue"
truncation_length = 0
truncate_to_repo = false

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[ $branch]($style)"
style = "bold bright-yellow"

[git_status]
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "  "
untracked = "  "
modified = "  "
staged = "  "
renamed = "  "
deleted = "  "
stashed = "  "
ahead = "  "
behind = "  "
diverged = "  "

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-red"

rebase = "REBASE"
merge = "MERGE"
cherry_pick = "CHERRY"
bisect = "BISECT"
revert = "REVERT"


[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []
